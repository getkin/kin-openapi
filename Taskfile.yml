version: "3"

tasks:
  golangci-lint:
    internal: true
    desc: "Install golangci-lint v2.8.0"
    status:
      - type golangci-lint
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0

  lint:
    desc: "Run linters"
    deps:
      - golangci-lint
    cmds:
      - golangci-lint run --new-from-rev=master ./...
